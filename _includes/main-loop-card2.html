<div class="mb-5 d-flex justify-content-between main-loop-card">
<div class="pr-3">

	<small class="text-muted font-italic">		Como se ha creado la imagen que acompaña a: 	</small>

	<a class="text-primary" href="{{site.baseurl}}{{post.url}}">{{ post.title }}</a>

	<small class="text-muted">
		{{ post.date | date: '%b %d, %Y' }}
	</small>

	
					<small class="text-muted">
                        <a class="text-capitalize text-muted smoothscroll" href="{{site.baseurl}}/author-{{ post.author }}.html"> | Por {{ post.author }}</a>  <span class="sep"> </span>						
                    </small>


                    	{% if post.author == "IAgo"  %}
                		<img alt="{{ site.authors.IAgo.name }}" src="{{site.baseurl}}/{{ site.authors.IAgo.avatar }}" class="rounded-circle" height="20" width="20">
                		{% endif %}                
                		{% if post.author == "Sebastian"  %}
                		<img alt="{{ site.authors.Sebastian.name }}" src="{{site.baseurl}}/{{ site.authors.Sebastian.avatar }}" class="rounded-circle" height="20" width="20">
                		{% endif %}  

	<h2 class="mb-1 h6 font-weight-bold">
	<a></a>
	<a class="text-dark"><br>Prompt para Freepik / ChatGPT:</a>
	</h2>

	<p class="excerpt">
	   {{ post.iarts  }}
	</p>

{% if post.image %}
	<div class="col-md-12 pr-0 text-right">
	<a href="{{site.baseurl}}{{post.url}}">
	<img class="w-100" src="{% if post.image contains "://" %}{{ post.image }}{% else %}{{ site.baseurl }}/{{ post.image }}{% endif %}" alt="{{ post.title }}">
	</a>
	</div>
{% endif %}

</div>

</div>
